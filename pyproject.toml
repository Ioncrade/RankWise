[project]
name = "rankwise"
version = "0.1.0"
description = "A source-grounded PDF retrieval and notes backend"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "flask>=3.1,<4",
  "numpy>=2.0,<3",
  "pymupdf>=1.26,<2",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
ml = [
  "faiss-cpu>=1.11,<2",
  "groq>=0.31,<1",
  "sentence-transformers>=5.0,<6",
]
science = [
  "matplotlib>=3.10,<4",
  "pint>=0.25,<1",
  "sympy>=1.14,<2",
]
chemistry = [
  "rdkit>=2025.3,<2027",
]
evaluation = [
  "datasets>=3.0,<5",
  "langchain-community>=0.3.31,<0.4",
  "ragas>=0.3,<1",
]

[dependency-groups]
dev = [
  "pyyaml>=6.0,<7",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rankwise"]

[tool.pytest.ini_options]
addopts = "-q --cov=rankwise --cov-report=term-missing --cov-fail-under=75"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
